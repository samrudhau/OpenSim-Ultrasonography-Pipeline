# ============================================================
# pipeline_config.yaml
# Global settings for the OpenSim biomechanical pipeline.
# Updated for the Bilateral Upper Extremity Trunk (BUET) model.
# No code changes are needed when tuning these values.
# ============================================================

# --- Pipeline Mode ---
pipeline_mode: compute

# --- Data Locations ---
data_root: "D:/OPENCAP FILES - Copy"
output_root: "D:/OPENCAP FILES - Copy/opensim_pipeline/outputs"
results_root: "D:/OPENCAP FILES - Copy/opensim_pipeline/results"

# Pattern used to detect patient folders inside data_root.
patient_folder_markers:
  - "MarkerData"
  - "OpenSimData"

# Task trial file name pattern (glob)
task_mot_pattern: "*.mot"

# Static / neutral trial TRC file name pattern
neutral_trc_pattern: "neutral*.trc"

# Task trial TRC file name pattern
task_trc_pattern: "usg*.trc"

# --- Model ---
model:
  # Use the BUET model directly — no re-scaling performed.
  # The BUET model is already present in each participant's OpenSimData/Model/ folder.
  use_opencap_scaled_model: false
  use_buet_model: true
  buet_model_name: "Bilateral Upper Extremity Trunk Model.osim"
  # Fallback pattern (used only if use_opencap_scaled_model: true)
  scaled_model_pattern: "*_scaled.osim"

# --- Lumbar Coordinate Rename ---
# The OpenCap .mot files use Lai-Uhlrich coordinate names.
# The BUET model uses different names for the 3 lumbar DOFs.
# This map is applied by mot_adapter.py before ID/SO/JRA.
lumbar_coord_rename:
  lumbar_extension: flex_extension
  lumbar_bending:   lat_bending
  lumbar_rotation:  axial_rotation

# --- Inverse Kinematics ---
# OpenCap already performs IK and provides .mot files.
# use_opencap_kinematics: true skips re-running IK (recommended).
inverse_kinematics:
  use_opencap_kinematics: true
  ik_accuracy: 1.0e-8
  constraint_weight: 20.0
  report_errors: true
  rms_residual_threshold_cm: 2.0

# --- Inverse Dynamics ---
inverse_dynamics:
  lowpass_filter_freq: 6.0
  filter_order: 4
  output_gen_forces: false
  clip_start_time: 0.0

# --- Static Optimization ---
static_optimization:
  activation_exponent: 2
  use_model_force_set: true
  reserve_optimal_force: 1000.0
  lowpass_cutoff_frequency: 6.0
  step_interval: 4
  lock_coordinates: []
  clip_start_time: 0.0

# --- Joint Reaction Analysis ---
joint_reaction_analysis:
  # Joint names must match the BUET model's JointSet names exactly.
  # These produce columns like: acromial_r_on_humerus_r_in_ground_fx/fy/fz
  joints_of_interest:
    - acromial_r   # Glenohumeral right
    - acromial_l   # Glenohumeral left
    - elbow_r      # Humero-ulnar right
    - elbow_l      # Humero-ulnar left
    - radioulnar_r # Radio-ulnar right
    - radioulnar_l # Radio-ulnar left
    - radius_hand_r # Wrist right
    - radius_hand_l # Wrist left
  express_in_frame: "child"   # Express reaction in child body frame
  apply_on_bodies: "child"    # Report force on child body

  # Column prefix patterns for extracting resultant force per joint from JRA .sto
  # OpenSim names them: <joint>_on_<child>_in_ground_fx/fy/fz
  jra_column_map:
    glenohumeral_r_N:  "acromial_r_on_humerus_r_in_ground"
    glenohumeral_l_N:  "acromial_l_on_humerus_l_in_ground"
    elbow_r_N:         "elbow_r_on_ulna_r_in_ground"
    elbow_l_N:         "elbow_l_on_ulna_l_in_ground"
    radioulnar_r_N:    "radioulnar_r_on_radius_r_in_ground"
    radioulnar_l_N:    "radioulnar_l_on_radius_l_in_ground"
    wrist_r_N:         "radius_hand_r_on_hand_r_in_ground"
    wrist_l_N:         "radius_hand_l_on_hand_l_in_ground"

# --- Muscle Group Mapping ---
