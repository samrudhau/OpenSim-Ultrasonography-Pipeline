# --- Joint DOF → Output Label Mapping ---
# Maps BUET model coordinate names → thesis/output variable names.
# ID columns are named like: <coord>_moment (rotational) or <coord>_force (translational)
joint_dof_map:
  # Lumbar (BUET names)
  flex_extension:  lumbar_flexion_Nm
  lat_bending:     lumbar_sideflex_Nm
  axial_rotation:  lumbar_rotation_Nm
  # Right arm
  arm_flex_r:      shoulder_flexion_r_Nm
  arm_add_r:       shoulder_abduction_r_Nm
  arm_rot_r:       shoulder_rotation_r_Nm
  elbow_flex_r:    elbow_flexion_r_Nm
  pro_sup_r:       prosup_r_Nm
  # Left arm
  arm_flex_l:      shoulder_flexion_l_Nm
  arm_add_l:       shoulder_abduction_l_Nm
  arm_rot_l:       shoulder_rotation_l_Nm
  elbow_flex_l:    elbow_flexion_l_Nm
  pro_sup_l:       prosup_l_Nm

# --- IK Joint Angle Map ---
# Maps BUET model coordinate names → output labels (degrees)
joint_angle_map:
  # Lumbar (BUET names)
  flex_extension:  lumbar_flexion_deg
  lat_bending:     lumbar_sideflex_deg
  axial_rotation:  lumbar_rotation_deg
  # Right arm
  arm_flex_r:      shoulder_flexion_r_deg
  arm_add_r:       shoulder_abduction_r_deg
  arm_rot_r:       shoulder_rotation_r_deg
  elbow_flex_r:    elbow_flexion_r_deg
  pro_sup_r:       forearm_pronation_r_deg
  # Left arm
  arm_flex_l:      shoulder_flexion_l_deg
  arm_add_l:       shoulder_abduction_l_deg
  arm_rot_l:       shoulder_rotation_l_deg
  elbow_flex_l:    elbow_flexion_l_deg
  pro_sup_l:       forearm_pronation_l_deg

# --- Output / Plotting ---
output:
  save_plots: true
  plot_format: png
  overwrite_existing: true
  plot_muscles:
